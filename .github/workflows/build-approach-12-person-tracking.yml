name: Build approach_12_person_tracking

on:
  push:
    paths:
      - 'src/approach_12_person_tracking/**'

# GitHub Pages へのデプロイに必要な権限を設定
permissions:
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      directory: ./src/approach_12_person_tracking
