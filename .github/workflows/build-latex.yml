name: Build LaTeX

on:
  push:
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '**/.latexmkrc'
      - '**/*.png'
      - '**/*.pdf'
      - '**/*.eps'
      - '!**/notes'
  pull_request:
  workflow_dispatch:

env:
  TEX_ROOT_FILE: "main.tex"
  PDF_OUTPUT_FILE: ${{ vars.PDF_OUTPUT_FILE }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ env.TEX_ROOT_FILE }}
          latexmk_use_lualatex: true

      # 解像度を中画質（150 dpi）に落として圧縮
      - name: Compress PDF document
        run: |
          gs -dNOSAFER \
             -sDEVICE=pdfwrite \
             -dCompatibilityLevel=1.4 \
             -dPDFSETTINGS=/ebook \
             -dNOPAUSE \
             -dQUIET \
             -dBATCH \
             -sOutputFile=compressed.pdf main.pdf

      - name: Rename output PDF
        run: mv compressed.pdf "${{ env.PDF_OUTPUT_FILE }}"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: latex-pdf-document
          path: ${{ env.PDF_OUTPUT_FILE }}
          archive: false
