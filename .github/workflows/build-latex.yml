name: Build LaTeX

on:
  push:
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '**/.latexmkrc'
      - '**/*.png'
      - '**/*.pdf'
      - '**/*.eps'
      - '!**/notes'
  pull_request:
  workflow_dispatch:

env:
  TEX_ROOT_FILE: "main.tex"
  PDF_OUTPUT_FILE: ${{ vars.PDF_OUTPUT_FILE }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ env.TEX_ROOT_FILE }}
          latexmk_use_lualatex: true

      - name: Rename output PDF
        run: mv main.pdf "${{ env.PDF_OUTPUT_FILE }}"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: latex-pdf-document
          path: ${{ env.PDF_OUTPUT_FILE }}
          archive: false
